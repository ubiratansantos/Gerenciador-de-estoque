<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Produto</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>✏️ Editar Produto</h1>

      <form
        action="{{ url_for('atualizar', id=produto.ID) }}"
        method="post"
        class="form-add"
        id="formEditar"
      >
        <div class="form-group">
          <label for="nome">Nome do Produto:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            value="{{ produto.Nome }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="descricao">Descrição:</label>
          <textarea id="descricao" name="descricao" rows="3">
{{ produto.Descricao }}</textarea
          >
        </div>

        <div class="form-group">
          <label for="quantidade">Quantidade:</label>
          <input
            type="number"
            id="quantidade"
            name="quantidade"
            value="{{ produto.Quantidade }}"
            required
            min="0"
          />
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$):</label>
          <input type="text" id="preco" name="preco" value="{{
          "%.2f"|format(produto.Preco) }}" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit">Atualizar Produto</button>
          <a href="{{ url_for('index') }}" class="btn-cancel">Cancelar</a>
        </div>
      </form>
    </div>

    <script>
      document.getElementById("formEditar").onsubmit = function (event) {
        var quantidadeInput = document.getElementById("quantidade");
        var valor = parseInt(quantidadeInput.value);

        if (valor < 0) {
          alert(
            "Erro: Não é possível salvar o produto com quantidade negativa."
          );
          event.preventDefault();
          return false;
        }
        return true;
      };
    </script>
  </body>
</html>
